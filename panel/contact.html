<section style="padding: 8px 0 0;">
    <h2 style="margin:0; font-size:44px; font-weight:300; letter-spacing:-0.4px; color:rgba(0,0,0,.58);">
      Contact
    </h2>
    <p style="margin:12px 0 0; font-size:12px; line-height:1.8; color:rgba(0,0,0,.45); max-width: 560px;">
      제휴/입점/단체 문의 등 무엇이든 남겨주세요. 빠르게 확인 후 안내드리겠습니다.
    </p>
  
    <div style="margin-top:24px; border-top:1px solid rgba(0,0,0,.18); padding-top:18px;">
      <div style="display:flex; gap:18px; flex-wrap:wrap;">
        <div style="font-size:12px; color:rgba(0,0,0,.55);">
          <span style="color:rgba(0,0,0,.75); font-weight:500;">Phone</span><br />
          031-584-6658
        </div>
        <div style="font-size:12px; color:rgba(0,0,0,.55);">
          <span style="color:rgba(0,0,0,.75); font-weight:500;">Email</span><br />
          contact@bluemetz.co.kr
        </div>
      </div>
    </div>
  
    <form style="margin-top:22px; display:flex; flex-direction:column; gap:14px;">
      <input
        style="border:1px solid rgba(0,0,0,.18); background:transparent; padding:14px 16px; font-size:13px; outline:none;"
        placeholder="Name"
      />
      <input
        style="border:1px solid rgba(0,0,0,.18); background:transparent; padding:14px 16px; font-size:13px; outline:none;"
        placeholder="Email"
      />
      <textarea
        style="border:1px solid rgba(0,0,0,.18); background:transparent; padding:14px 16px; font-size:13px; outline:none; min-height:180px; resize:vertical;"
        placeholder="Message"
      ></textarea>
  
      <button
        type="button"
        onclick="alert('패널 내부 폼은 데모입니다. 실제 전송은 백엔드/메일 연동으로 연결하세요.')"
        style="margin-top:6px; height:44px; border:0; background:#1f2430; color:#fff; font-size:12px; letter-spacing:.12em; cursor:pointer;"
      >
        SEND
      </button>
    </form>
  
    <div style="margin-top:22px; font-size:11px; color:rgba(0,0,0,.45); line-height:1.7;">
      * 운영 문의는 영업시간 내 순차 응답됩니다. (평일/주말 정책은 추후 기입)
    </div>
  </section>
